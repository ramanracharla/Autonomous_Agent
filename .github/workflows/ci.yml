name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node gateway and frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run typecheck:web
      - run: npm run build:web
      - run: npm audit

  agent:
    name: Python agent service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent_service/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r agent_service/requirements-test.txt
      - run: python -m pytest agent_service/tests -q
      - run: python -m pip install pip-audit
      - run: pip-audit -r agent_service/requirements-test.txt

  containers:
    name: Container builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: icepot-gateway:ci
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway
      - name: Build agent image
        uses: docker/build-push-action@v6
        with:
          context: agent_service
          file: agent_service/Dockerfile
          push: false
          tags: icepot-agent:ci
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: icepot-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
