services:
  gateway:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/icepot
      REDIS_URL: redis://redis:6379
      STREAM_AUTH_TOKEN: ${STREAM_AUTH_TOKEN:?Set STREAM_AUTH_TOKEN in your environment}
      DISRUPTION_POLL_INTERVAL_MS: ${DISRUPTION_POLL_INTERVAL_MS:-60000}
      PDF_EXPORT_DIR: /app/storage/pdfs
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 4s
      retries: 5
      start_period: 20s
    volumes:
      - pdf_exports:/app/storage/pdfs
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
  agent:
    build:
      context: ./agent_service
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 4s
      retries: 5
      start_period: 20s
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:5173:80"
    restart: unless-stopped
    depends_on:
      - gateway
      - agent
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 4s
      retries: 5
  mongo:
    image: mongo:8
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mongodb_data:
  pdf_exports:
